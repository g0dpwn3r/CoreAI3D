[supervisord]
nodaemon=true
; user=root  ; Removed: supervisord is run by a non-root user and cannot drop privileges
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor/

[program:linux_operations]
command=/usr/local/bin/train_linux_operations.py
directory=/workspace
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/linux_operations.err.log
stdout_logfile=/var/log/supervisor/linux_operations.out.log
; user=sandbox  ; Removed: non-root supervisord cannot switch users
environment=HOME="/home/sandbox",USER="sandbox"

[program:ssh_server]
command=/usr/sbin/sshd -D
directory=/workspace
autostart=false
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log
; user=root  ; Removed: non-root supervisord cannot switch users

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock