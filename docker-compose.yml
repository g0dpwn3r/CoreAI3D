services:
  mysql:
    image: mysql:latest
    container_name: coreai3d_mysql
    environment:
      MYSQL_ROOT_PASSWORD: pmAkRV4lAAKsOfdWCUxP
      MYSQL_DATABASE: CoreAI3D
    # Explicitly enable the X Plugin (X DevAPI / port 33060) and bind it on all
    # interfaces so other containers on the network can reach it.
    command:
      - "--mysqlx=ON"
      - "--mysqlx-bind-address=0.0.0.0"
      - "--mysqlx-port=33060"
    ports:
      - "33060:33060" # X Plugin
      - "33061:3306"   # classic protocol
    volumes:
        - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - skynet
    # Wait until MySQL is actually accepting connections before dependents start.
    # start_period covers the first-run data directory initialization.
    healthcheck:
      # Use the same MYSQL_ROOT_PASSWORD value set above so rotating the password
      # can't silently break the healthcheck (which would block dependents forever).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  coreai3d:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: coreai3d
    depends_on:
      mysql:
        condition: service_healthy # Wait for MySQL healthcheck to pass
    networks:
      - skynet
    environment:
      DB_HOST: mysql
      DB_PORT: 33060
      DB_USER: root
      DB_PASSWORD: pmAkRV4lAAKsOfdWCUxP
      DB_SCHEMA: CoreAI3D
    ports:
      - "1906:8080" # API Server
      - "1907:8081" # WebSocket Server
    volumes:
      - ./linux_gui/training_data:/training_data
      # Mount the actual embedding file from your host's root folder into the container
      - ./wiki_giga_2024_300_MFT20_vectors_seed_2024_alpha_0.75_eta_0.05_combined.txt:/training_data/emb.txt:ro
    command:
      - "/app/CoreAI3D"
      - "--api-port"
      - "8080"
      - "--enable-websocket"
      - "--calculus-activation"  # Enabled calculus-based activation functions
      - "--db-host"
      - "mysql"
      - "--db-port"
      - "33060"
      - "--db-user"
      - "root"
      - "--db-password"
      - "pmAkRV4lAAKsOfdWCUxP"
      - "--db-schema"
      - "CoreAI3D"
      - "--embedding-file"
      - "/training_data/emb.txt" # Points to the mounted file inside the container
  # Linux Sandbox Environments
  ubuntu-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile.ubuntu
    container_name: ubuntu_sandbox
    stdin_open: true
    tty: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    volumes:
      - ./training_data:/training_data
      - ./sandbox_workspace:/workspace
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - SANDBOX_TYPE=ubuntu
    networks:
      - skynet  

  kali-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile.kali
    container_name: kali_sandbox
    stdin_open: true
    tty: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    volumes:
      - ./training_data:/training_data
      - ./sandbox_workspace:/workspace
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - SANDBOX_TYPE=kali
    networks:
      - skynet    

  alpine-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile.alpine
    container_name: alpine_sandbox
    stdin_open: true
    tty: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    volumes:
      - ./training_data:/training_data
      - ./sandbox_workspace:/workspace
    environment:
      - SANDBOX_TYPE=alpine
    networks:
      - skynet

  # AI Training Environment
  ai-trainer:
    build:
      context: .
      dockerfile: docker/training/Dockerfile.trainer
    container_name: ai_trainer
    networks:
      - skynet
    restart: unless-stopped
    depends_on:
      - ubuntu-sandbox
      - kali-sandbox
      - alpine-sandbox
    volumes:
      - ./training_data:/training_data
      - ./ai_models:/ai_models
      - ./logs:/logs
    environment:
      - TRAINING_MODE=true
      - LOG_LEVEL=INFO
    command: ["python3", "/app/train_linux_operations.py"]

  admin-desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce # <--- This guarantees the latest rolling Ubuntu base
    container_name: coreai3d_admin_gui
    privileged: true  # Allows the X server and DBus to launch panels without kernel blocks
    shm_size: "2gb"   # Expanded video memory allocation
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - .:/app
      - webtop_desktop_config:/config 
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:          # <--- ADD THIS LINE
      - skynet
volumes:
    mysql_data:
    webtop_desktop_config:

networks:
  skynet:
    driver: bridge
